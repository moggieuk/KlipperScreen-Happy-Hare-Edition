[project]
name = "KlipperScreen"
description = "GUI for Klipper"
readme = "README.md"
requires-python = ">=3.8"

[tool.ruff]
line-length = 100
target-version = "py38"

# Translation helper
builtins = ["_", "ngettext"]

extend-exclude = [
    "docs",
    "scripts",
    ".venv",
]

[tool.ruff.lint]
# E: pycodestyle, F: Pyflakes, I: isort (import sorting)
select = [
    "E9",
    "F",
    "I",
    "E401", # Multiple imports on one line
    "E713", # Prefer `not in`
    "E741", # Ambiguous variable names
]

[tool.ruff.lint.isort]
known-first-party = ["ks_includes", "panels"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

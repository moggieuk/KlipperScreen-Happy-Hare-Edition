name: Verify Code Formatting
on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - 'docs/**'
      - 'ks_includes/locales/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'ks_includes/locales/**'
jobs:
  lint-python-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.15.22"
          args: check screen.py ks_includes panels
      - run: ruff format --check screen.py ks_includes panels
